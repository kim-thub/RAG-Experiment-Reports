[project]
name = "starter-rag-search-experiments"
version = "0.1.0"
description = "Isolated search experiments for starter-rag"
requires-python = ">=3.13,<3.14"
dependencies = [
    "starter-rag",
    "graphrag==3.3.0",
    "rank-bm25==0.2.2",
    "tiktoken>=0.12,<1",
    "PyYAML>=6,<7",
    "jsonschema>=4.25,<5",
]

[project.scripts]
starter-rag-experiment = "starter_rag_experiments.cli:main"
starter-rag-graphrag-extract = "starter_rag_experiments.graphrag_json_schema:main"
starter-rag-g1-ollama = "starter_rag_experiments.g1_ollama_light:main"
starter-rag-g1-jsonschema-run = "starter_rag_experiments.g1_jsonschema_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starter_rag_experiments"]

[tool.hatch.build.targets.wheel.force-include]
"starter_rag_experiments/schemas/g1_graph_extraction.schema.json" = "starter_rag_experiments/schemas/g1_graph_extraction.schema.json"

[tool.uv.sources]
starter-rag = { path = "../..", editable = true }
