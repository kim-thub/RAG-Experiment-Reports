<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 665" role="img" aria-labelledby="title description">
  <title id="title">검색 방식별 Hit@k와 MRR@10</title>
  <desc id="description">29문항 Silver Set. 사용자 제공 이전 집계의 Dense V0와 JSON Schema 최종 집계의 V1, H1, G1을 비교한다. G1은 2,100개 중 120개 청크의 부분 그래프 파일럿이며 V1/H1 Top10을 그래프 입력 선택과 검색 시드에 사용했다. H1은 Hit@5와 Hit@10이 가장 높고 V1은 Hit@3과 MRR@10이 가장 높다.</desc>
