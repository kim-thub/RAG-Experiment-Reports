    .section { font-size: 17px; font-weight: 650; }
    .label { font-size: 14px; }
    .small { font-size: 12px; fill: #596579; }
    .value { font-size: 12px; font-weight: 650; }
    .grid { stroke: #dce2ea; stroke-width: 1; }
    .axis { stroke: #8893a4; stroke-width: 1.2; }
