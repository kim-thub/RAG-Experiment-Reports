# RAG-only uv workspace. The package source remains under rag/starter_rag/.
[project]
name = "starter-rag-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["starter-rag[ingestion]"]

[tool.uv]
managed = true
package = false

[tool.uv.workspace]
members = ["rag"]

[tool.uv.sources]
starter-rag = { workspace = true }

[dependency-groups]
dev = [
    "alembic>=1.13,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.13,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
